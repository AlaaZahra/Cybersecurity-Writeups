<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#12243b"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b57"/>
      <stop offset="1" stop-color="#ef3f61"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35bdf6"/>
      <stop offset="1" stop-color="#5974ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ff5b64"/>
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#41c7ff"/>
    </marker>
    <style>
      .title { font: 700 52px Arial, sans-serif; fill: #fff; }
      .sub { font: 400 22px Arial, sans-serif; fill: #a8bdd2; }
      .host { font: 700 29px Arial, sans-serif; fill: #fff; }
      .ip { font: 600 23px Consolas, monospace; fill: #dcefff; }
      .step { font: 700 22px Arial, sans-serif; fill: #fff; }
      .detail { font: 400 18px Arial, sans-serif; fill: #c9d7e6; }
      .tag { font: 700 15px Arial, sans-serif; fill: #fff; letter-spacing: 1px; }
      .num { font: 700 25px Arial, sans-serif; fill: #fff; }
      .footer { font: 400 17px Arial, sans-serif; fill: #829bb4; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="270" fill="#173257" opacity="0.28"/>
  <circle cx="1770" cy="980" r="340" fill="#3d1749" opacity="0.20"/>

  <text x="960" y="76" text-anchor="middle" class="title">Tomcat Takeover Attack Chain</text>
  <text x="960" y="112" text-anchor="middle" class="sub">From active scanning to root-level persistence</text>

  <!-- Attacker host -->
  <g>
    <rect x="90" y="175" width="390" height="170" rx="24" fill="#1b2b40" stroke="#ff5b64" stroke-width="3"/>
    <circle cx="165" cy="248" r="43" fill="#3b1f2c" stroke="#ff5b64" stroke-width="3"/>
    <path d="M145 253 Q165 270 185 253 M148 235 L158 242 M182 235 L172 242" fill="none" stroke="#ff7c82" stroke-width="6" stroke-linecap="round"/>
    <text x="230" y="228" class="host">Attacker</text>
    <text x="230" y="263" class="ip">14.0.0.120</text>
    <rect x="230" y="281" width="165" height="28" rx="14" fill="#762d43"/>
    <text x="312" y="301" text-anchor="middle" class="tag">EXTERNAL SOURCE</text>
  </g>

  <!-- Victim host -->
  <g>
    <rect x="1440" y="175" width="390" height="170" rx="24" fill="#1b2b40" stroke="#41c7ff" stroke-width="3"/>
    <rect x="1500" y="211" width="88" height="76" rx="8" fill="#153956" stroke="#41c7ff" stroke-width="3"/>
    <line x1="1514" y1="231" x2="1574" y2="231" stroke="#41c7ff" stroke-width="5"/>
    <line x1="1514" y1="249" x2="1574" y2="249" stroke="#41c7ff" stroke-width="5"/>
    <line x1="1514" y1="267" x2="1552" y2="267" stroke="#41c7ff" stroke-width="5"/>
    <text x="1620" y="221" class="host">Tomcat Server</text>
    <text x="1620" y="256" class="ip">10.0.0.112:8080</text>
    <rect x="1620" y="278" width="142" height="28" rx="14" fill="#174d71"/>
    <text x="1691" y="298" text-anchor="middle" class="tag">VICTIM HOST</text>
  </g>

  <!-- Initial attack path -->
  <path d="M485 260 C720 170 1200 170 1435 260" fill="none" stroke="#ff5b64" stroke-width="5" marker-end="url(#arrow-red)"/>
  <rect x="768" y="160" width="384" height="54" rx="27" fill="#431d2c" stroke="#ff5b64" stroke-width="2"/>
  <text x="960" y="194" text-anchor="middle" class="step">Inbound compromise activity</text>

  <!-- Timeline -->
  <line x1="250" y1="475" x2="1670" y2="475" stroke="#415a73" stroke-width="4"/>

  <g>
    <circle cx="270" cy="475" r="30" fill="#315c8b"/><text x="270" y="484" text-anchor="middle" class="num">1</text>
    <rect x="120" y="525" width="300" height="150" rx="18" fill="#172a3d" stroke="#3aaee8" stroke-width="2"/>
    <text x="145" y="563" class="step">Port scanning</text>
    <text x="145" y="596" class="detail">Rapid SYN requests across</text>
    <text x="145" y="624" class="detail">multiple TCP ports</text>
    <text x="145" y="652" class="ip">Target: 10.0.0.112</text>
  </g>

  <g>
    <circle cx="615" cy="475" r="30" fill="#315c8b"/><text x="615" y="484" text-anchor="middle" class="num">2</text>
    <rect x="465" y="525" width="300" height="150" rx="18" fill="#172a3d" stroke="#3aaee8" stroke-width="2"/>
    <text x="490" y="563" class="step">Web enumeration</text>
    <text x="490" y="596" class="detail">Gobuster 3.6 discovers</text>
    <text x="490" y="624" class="detail">the Tomcat admin interface</text>
    <text x="490" y="652" class="ip">Path: /manager</text>
  </g>

  <g>
    <circle cx="960" cy="475" r="30" fill="#c7742e"/><text x="960" y="484" text-anchor="middle" class="num">3</text>
    <rect x="810" y="525" width="300" height="150" rx="18" fill="#35291f" stroke="#ff9f43" stroke-width="2"/>
    <text x="835" y="563" class="step">Valid account access</text>
    <text x="835" y="596" class="detail">HTTP Basic Authentication</text>
    <text x="835" y="624" class="detail">credentials are accepted</text>
    <text x="835" y="652" class="ip">admin:tomcat</text>
  </g>

  <g>
    <circle cx="1305" cy="475" r="30" fill="#c24755"/><text x="1305" y="484" text-anchor="middle" class="num">4</text>
    <rect x="1155" y="525" width="300" height="150" rx="18" fill="#38212a" stroke="#ff5b64" stroke-width="2"/>
    <text x="1180" y="563" class="step">Malicious deployment</text>
    <text x="1180" y="596" class="detail">Tomcat Manager receives</text>
    <text x="1180" y="624" class="detail">a weaponized WAR archive</text>
    <text x="1180" y="652" class="ip">JXQOZY.war</text>
  </g>

  <g>
    <circle cx="1650" cy="475" r="30" fill="#c24755"/><text x="1650" y="484" text-anchor="middle" class="num">5</text>
    <rect x="1500" y="525" width="300" height="150" rx="18" fill="#38212a" stroke="#ff5b64" stroke-width="2"/>
    <text x="1525" y="563" class="step">Root shell execution</text>
    <text x="1525" y="596" class="detail">The deployed application</text>
    <text x="1525" y="624" class="detail">starts an interactive shell</text>
    <text x="1525" y="652" class="ip">whoami → root</text>
  </g>

  <!-- Reverse connection -->
  <path d="M1480 785 C1190 935 730 935 440 785" fill="none" stroke="#41c7ff" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <rect x="690" y="865" width="540" height="66" rx="33" fill="#123951" stroke="#41c7ff" stroke-width="2"/>
  <text x="960" y="892" text-anchor="middle" class="step">Reverse shell callback</text>
  <text x="960" y="919" text-anchor="middle" class="ip">10.0.0.112 → 14.0.0.120:443</text>

  <g>
    <rect x="1320" y="735" width="410" height="104" rx="18" fill="#2d2040" stroke="#b579ff" stroke-width="2"/>
    <circle cx="1368" cy="787" r="28" fill="#7542aa"/><text x="1368" y="796" text-anchor="middle" class="num">6</text>
    <text x="1415" y="774" class="step">Cron persistence</text>
    <text x="1415" y="807" class="detail">Callback runs every minute</text>
  </g>

  <rect x="120" y="976" width="1680" height="55" rx="12" fill="#0b1725" stroke="#263e56"/>
  <text x="960" y="1011" text-anchor="middle" class="footer">Evidence: Wireshark PCAP analysis  |  CyberDefenders Tomcat Takeover  |  Analyst: Alaa Zahra</text>
</svg>
